<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contraloría de fichas clínicas — Clínica Cruz Nacional</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style id="estiloPagina">@page{size:letter portrait;margin:12mm}</style>
<style>
:root{--azul:#0066CC;--navy:#003366;--rojo:#FF3333;--bg:#F7F9FC;--borde:#E2E8F0;--texto:#1E293B;--gris:#64748B;--ok:#10B981;--mal:#DC2626;--cumple:#1F5FAD;--nocumple:#C00000}
*{box-sizing:border-box}
body{margin:0;font-family:'Carlito',Calibri,Arial,sans-serif;font-size:15px;color:var(--texto);background:var(--bg)}
h1,h2,h3,h4{font-family:'DM Sans',Arial,sans-serif;color:var(--navy);margin:0 0 .5rem}
header{background:var(--navy);color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{color:#fff;font-size:1.15rem;margin:0}
header .ctx{margin-left:auto;font-size:.9rem;opacity:.9}
main{max-width:1440px;margin:0 auto;padding:1.2rem}
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--borde);margin-bottom:1rem;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:.6rem 1rem;font-weight:700;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;font-size:.95rem}
.tabs button.on{color:var(--azul);border-color:var(--azul)}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:1.1rem;margin-bottom:1rem}
.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--azul);background:var(--azul);color:#fff;border-radius:8px;padding:.45rem .9rem;cursor:pointer;font-weight:700;font-family:inherit;font-size:.9rem}
.btn.sec{background:#fff;color:var(--azul)}
.btn.peligro{background:#fff;color:var(--mal);border-color:var(--mal)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{padding:.4rem .5rem;border:1px solid var(--borde);border-radius:6px;font-family:inherit;font-size:.9rem}
label{font-weight:700;font-size:.85rem;color:var(--gris)}
.muted{color:var(--gris)}.small{font-size:.85rem}
.err{color:var(--mal);font-weight:700;margin-top:.5rem}
.notice{background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:.6rem .8rem;font-size:.9rem;margin:.6rem 0}
.ok-msg{background:#D1FAE5;border:1px solid #A7F3D0;border-radius:8px;padding:.6rem .8rem;font-size:.9rem;margin:.6rem 0}
.mal-msg{background:#FEE2E2;border:1px solid #FCA5A5;border-radius:8px;padding:.6rem .8rem;font-size:.95rem;margin:.6rem 0}
.tabla{overflow:auto;max-height:72vh;border:1px solid var(--borde);border-radius:8px;position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.85rem}
th{background:#E6EEF8;color:var(--navy);position:sticky;top:0;z-index:2;text-align:left;font-family:'DM Sans',Arial,sans-serif;font-size:.78rem;padding:.45rem;white-space:nowrap;border-bottom:1px solid var(--borde)}
td{padding:.35rem .45rem;border-bottom:1px solid var(--borde);white-space:nowrap;background:#fff}
tr.fila-filtros th{top:31px;background:#F1F5F9;padding:.25rem}
tr.sel td{background:#FFF59D}
/* Auditoría: filas alternadas, fila activa y columnas fijas */
.auditoria tbody tr:nth-child(even) td{background:#F8FAFC}
.auditoria tbody tr:hover td,.auditoria tbody tr.activa td{background:#E0F2FE}
.auditoria tbody tr:hover td.fija,.auditoria tbody tr.activa td.fija{background:#BAE6FD}
.auditoria .fija{position:sticky;z-index:1}
.auditoria th.fija{z-index:3}
.auditoria td.fija{font-weight:700}
.auditoria .c0{left:0;min-width:44px;max-width:44px}
.auditoria .c1{left:44px;min-width:86px;max-width:86px}
.auditoria .c2{left:130px;min-width:110px;max-width:110px;box-shadow:2px 0 0 #94A3B8}
.celda-ev{display:inline-block;width:100%;min-width:96px;text-align:center;font-weight:700;font-size:.78rem;border-radius:4px;padding:.3rem .2rem;cursor:pointer;user-select:none;border:1px dashed #CBD5E1;color:#94A3B8;background:#fff}
.celda-ev.c{background:var(--cumple);color:#fff;border-color:var(--cumple)}
.celda-ev.n{background:var(--nocumple);color:#fff;border-color:var(--nocumple)}
.celda-ev.pend{border:2px solid var(--mal);background:#FEF2F2;color:var(--mal)}
.celda-ev.bloq{cursor:default;opacity:.92}
.badge-cerrada{background:#E0E7FF;color:#3730A3;border-radius:999px;padding:.15rem .6rem;font-size:.8rem;font-weight:700}
select.ev{font-weight:700;border:0;border-radius:4px;padding:.25rem .3rem;color:#fff;background:#94A3B8;width:118px}
select.ev.c{background:var(--cumple)}select.ev.n{background:var(--nocumple)}select.ev.a{background:#64748B}
select.turno{border-radius:12px;font-weight:700}
select.turno.A{background:#E9D5FF}select.turno.B{background:#FDE68A}
.kpi{font-family:'DM Sans',Arial,sans-serif;font-size:1.8rem;font-weight:700;color:var(--navy)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.lista-aud td{cursor:pointer}.lista-aud tr:hover td{background:#F1F5F9}
.badge-fijo{background:#D1FAE5;color:#065F46;border-radius:999px;padding:.15rem .6rem;font-size:.8rem;font-weight:700}
.avance{background:#E6EEF8;border-radius:999px;padding:.2rem .7rem;font-weight:700;color:var(--navy)}
.mono{font-family:Consolas,'Courier New',monospace;word-break:break-all}
/* Documentos imprimibles */
#impresion{display:none}
@media print{
  body{background:#fff}
  header,main{display:none!important}
  #impresion{display:block!important}
  .pagina{page-break-after:always;break-after:page;overflow:hidden}
  .pagina:last-child{page-break-after:auto;break-after:auto}
}
.doc{font-family:'Carlito',Calibri,Arial,sans-serif;color:#1E293B}
.doc h2{font-size:15pt;margin:.2rem 0 .4rem}
.doc h3{font-size:11.5pt;margin:.6rem 0 .25rem}
.doc table{border-collapse:collapse;width:100%}
.doc th,.doc td{border:1px solid #CBD5E1;padding:3px 5px;white-space:normal;position:static;background:#fff;vertical-align:top}
.doc th{background:#E6EEF8;color:#003366;font-family:'DM Sans',Arial,sans-serif}
.cert{width:190mm;font-size:10pt}
.cert th,.cert td{font-size:10pt}
.cert .datos{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.cert .datos table th{width:46%}
.numeros{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.numeros div{border:1px solid #CBD5E1;border-radius:3px;text-align:center;padding:2px;font-size:10pt}
.numeros div span{display:block;font-size:7.5pt;color:#475569}
.informe{width:258mm;font-size:11pt}
.informe th,.informe td{font-size:9pt;padding:2px 3px}
.informe table.detalle{table-layout:fixed}
.informe table.detalle td{white-space:nowrap;overflow:hidden;line-height:1.2}
.informe table.detalle td.item{white-space:normal;font-size:8.5pt;text-align:center}
.informe table.detalle th{white-space:normal;text-align:center;font-size:8.5pt;line-height:1.15}
.informe table.detalle td.largo{font-size:7.8pt}
.informe td.obs{white-space:normal!important}
.informe .cn{color:#fff;background:#C00000;font-weight:700;text-align:center}
.informe .cc{text-align:center}
</style>
</head>

function leerFecha(valor){
  const v = String(valor ?? '').trim();
  let m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return {texto:`${pad(m[1])}/${pad(m[2])}/${m[3]}`, iso:`${m[3]}-${pad(m[2])}-${pad(m[1])}`};
  m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return {texto:`${pad(m[3])}/${pad(m[2])}/${m[1]}`, iso:`${m[1]}-${pad(m[2])}-${pad(m[3])}`};
  return {texto:v, iso:''};
}
// Turno por fecha con secuencia AABB a partir de los turnos de los días 1 y 2 del mes
function turnoDeFecha(iso, cfg, mesBase){
  if (!iso || !cfg || !cfg.d1 || !cfg.d2 || !mesBase) return '';
  const [y, m] = mesBase.split('-').map(Number);
  const [yy, mm, dd] = iso.split('-').map(Number);
  const dias = Math.round((Date.UTC(yy, mm - 1, dd) - Date.UTC(y, m - 1, 1)) / 86400000);
  const otro = t => t === 'A' ? 'B' : 'A';
  const ciclo = cfg.d1 === cfg.d2 ? [cfg.d1, cfg.d1, otro(cfg.d1), otro(cfg.d1)] : [cfg.d1, cfg.d2, cfg.d2, cfg.d1];
  return ciclo[((dias % 4) + 4) % 4];
}
// Tamaño muestral (calculadora SerQ): n0 = Z²·p·(1-p)/e² ; corrección por población finita
function tamanoMuestral(N, p, e, z = 1.96){
  if (!N) return 0;
  const n0 = z * z * p * (1 - p) / (e * e);
  return Math.min(N, Math.ceil(n0 / (1 + (n0 - 1) / N)));
}

}
const huellaTexto = async (texto) => sha256(new TextEncoder().encode(texto));
function decodificar(buffer){
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buffer); }
  catch { return new TextDecoder('windows-1252').decode(buffer); }
}
function parsearCSV(texto){
  const lineas = texto.replace(/^\ufeff/, '').replace(/\r\n?/g, '\n');
  let sep = ',';
  const primera = lineas.split('\n')[0];
  const mSep = primera.match(/^"?sep=(.)/i);
  if (mSep) sep = mSep[1];
  else if ((primera.match(/;/g) || []).length > (primera.match(/,/g) || []).length) sep = ';';
  const filas = []; let fila = [], campo = '', comillas = false;
  for (let i = 0; i < lineas.length; i++){
    const c = lineas[i];
    if (comillas){
      if (c === '"' && lineas[i+1] === '"'){ campo += '"'; i++; }
      else if (c === '"') comillas = false;
      else campo += c;
    } else if (c === '"') comillas = true;
    else if (c === sep){ fila.push(campo); campo = ''; }
    else if (c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
    else campo += c;
  }
  if (campo || fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}
function descargarBlob(blob, nombre){
  const enlace = document.createElement('a');
  enlace.href = URL.createObjectURL(blob); enlace.download = nombre;
  document.body.appendChild(enlace); enlace.click(); enlace.remove();
  setTimeout(() => URL.revokeObjectURL(enlace.href), 2000);
}

function leerClave(clave){ try { return JSON.parse(localStorage.getItem(clave)); } catch (e){ console.error('No se pudo leer', clave, e); return null; } }
function normalizarAuditoria(a, calendario){
  a.sucursal = nombreOficial(a.sucursal || '');
  if (!a.mesBase){ const m = String(a.periodo || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); a.mesBase = m ? `${m[3]}-${m[2]}` : (a.registros?.find(r => r.fechaIso)?.fechaIso || '').slice(0, 7); }
  if (a.turnoDia1 && a.turnoDia2 && a.mesBase && !calendario[a.mesBase]) calendario[a.mesBase] = {d1:a.turnoDia1, d2:a.turnoDia2};
  if (a.turnoDia1 && a.turnoDia2) a.turnos = a.turnos || {d1:a.turnoDia1, d2:a.turnoDia2};
  a.parametros = a.parametros || {p:0.95, e:0.1, z:1.96};
  if (a.original === undefined) a.original = null;
  if (a.urgencias && a.urgencias.codigo === undefined) a.urgencias.codigo = '';
  if (a.externos){
    if (a.externos.codigo === undefined) a.externos.codigo = '';
    a.externos.fichas.forEach(f => {
      if (f.observaciones === undefined) f.observaciones = '';
      if (f.turno === undefined) f.turno = turnoDeFecha(f.fechaIso || leerFecha(f.fecha).iso, a.turnos || calendario[a.mesBase], a.mesBase);
    });
  }
  return a;
}
function cargarAlmacen(){
  let base = leerClave(CLAVE_ALMACEN);
  if (!base) base = {auditorias:{}, calendario:{}, migrado:false};
  base.calendario = base.calendario || {};
  if (!base.migrado){
    // Primera apertura de la v4: se traen las auditorías de la v3, v2 y v1 sin borrarlas de su lugar original
    CLAVES_ANTERIORES.forEach(clave => {
      const viejo = leerClave(clave);
      Object.values(viejo?.auditorias || {}).forEach(a => {
        const n = normalizarAuditoria(JSON.parse(JSON.stringify(a)), base.calendario);
        const id = `${n.sucursal}|${n.periodo || n.archivo}`;
        if (!base.auditorias[id]){ n.clave = id; n.recuperada = clave.replace('cn_contraloria_fichas_', ''); base.auditorias[id] = n; }
      });
    });
    base.migrado = true;
    try { localStorage.setItem(CLAVE_ALMACEN, JSON.stringify(base)); } catch (e){ console.error(e); }
  }
  Object.values(base.auditorias).forEach(a => normalizarAuditoria(a, base.calendario));
  return base;
}
function guardar(){

}

/* ---------- Lectura del reporte de SAM ---------- */
async function leerReporte(archivo){
  const buffer = await archivo.arrayBuffer();
  let filas;
  if (/\.xlsx?$/i.test(archivo.name)){
    if (typeof XLSX === 'undefined') throw new Error('No se pudo cargar el lector de Excel (revisa la conexión) o usa el CSV.');
    const libro = XLSX.read(buffer, {type:'array', raw:false});
    filas = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]], {header:1, raw:false, defval:''});
  } else filas = parsearCSV(decodificar(buffer));
  let sucursal = '', periodo = '';
  const iEnc = filas.findIndex(f => f.some(c => norm(c) === 'PRESUPUESTO') && f.some(c => norm(c).startsWith('TIPO ATENCI')));
  if (iEnc < 0) throw new Error('No se encontró la fila de encabezados (Presupuesto, Tipo Atención...). Verifica que sea el "Reporte Pacientes en alta".');
  filas.slice(0, iEnc).forEach(f => {
    const t = f.join(' ').trim();
    const ms = t.match(/Sucursal:\s*(.+)/i); if (ms) sucursal = ms[1].trim();
    const mp = t.match(/Entre fechas:\s*(.+)/i); if (mp) periodo = mp[1].trim();
  });
  const enc = filas[iEnc].map(norm);
  const col = (...nombres) => { for (const n of nombres){ const i = enc.findIndex(h => h === n); if (i >= 0) return i; } for (const n of nombres){ const i = enc.findIndex(h => h.startsWith(n)); if (i >= 0) return i; } return -1; };
  const c = {pres:col('PRESUPUESTO'), tipo:col('TIPO ATENCION'), sub:col('SUB TIPO ATENCION'), motivo:col('MOTIVO'), rut:col('RUT PACIENTE'), paciente:col('PACIENTE'), fecha:col('ADMISION'), medico:col('MEDICO PRE ALTA'), sucursal:col('SUCURSAL')};
  const faltan = [['Presupuesto',c.pres],['Tipo Atención',c.tipo],['Admisión',c.fecha],['Médico Pre Alta',c.medico],['Rut Paciente',c.rut]].filter(x => x[1] < 0).map(x => x[0]);
  if (faltan.length) throw new Error('Faltan columnas en el archivo: ' + faltan.join(', ') + '.');
  const filasDatos = filas.slice(iEnc + 1).filter(f => f[c.pres] && String(f[c.pres]).trim());
  if (!filasDatos.length) throw new Error('El archivo no tiene registros bajo los encabezados.');
  const val = (f, i) => i >= 0 ? String(f[i] ?? '').trim() : '';
  const registros = filasDatos.map(f => { const fecha = leerFecha(f[c.fecha]); return {ficha:val(f, c.pres), tipo:val(f, c.tipo), subtipo:val(f, c.sub), motivo:val(f, c.motivo), rut:val(f, c.rut), paciente:val(f, c.paciente), fecha:fecha.texto, fechaIso:fecha.iso, medico:val(f, c.medico)}; });
  if (!sucursal) sucursal = val(filasDatos[0], c.sucursal) || 'Sucursal no indicada';
  const nombreSucursal = nombreOficial(sucursal.replace(/^CRUZ NACIONAL\s*/i, '').trim() || sucursal);
  const mInicio = periodo.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  const mesBase = mInicio ? `${mInicio[3]}-${mInicio[2]}` : (registros.find(r => r.fechaIso)?.fechaIso || '').slice(0, 7);
  const original = {metadatos: filas.slice(0, iEnc).map(f => /^sep=/i.test(String(f[0] ?? '')) ? [f.map(x => String(x ?? '')).join(',').replace(/,+$/, ',')] : f.map(x => String(x ?? ''))), encabezado: filas[iEnc].map(x => String(x ?? '')), filas: filasDatos.map(f => f.map(x => String(x ?? '')))};
  return {sucursal:nombreSucursal, periodo, mesBase, registros, original, hash: await sha256(buffer), archivo: archivo.name};
}
async function procesarArchivo(archivo){
  const error = document.getElementById('errCarga') || {textContent:''}; error.textContent = '';
  try {
    const r = await leerReporte(archivo);
    const clave = `${r.sucursal}|${r.periodo || r.archivo}`;
    if (almacen.auditorias[clave] && !confirm(`Ya existe una auditoría de ${r.sucursal} (${r.periodo}). ¿Reemplazarla con este archivo? Se perderá el avance registrado.`)) return;
    almacen.auditorias[clave] = {clave, sucursal:r.sucursal, periodo:r.periodo, archivo:r.archivo, hash:r.hash, cargado:hoyTexto(), registros:r.registros,
      parametros:{p:0.95, e:0.1, z:1.96}, urgencias:null, externos:null, nExternos:10, mesBase:r.mesBase, turnos:null, original:r.original};
    actual = clave; guardar(); pestana = 'urgencias'; render();
  } catch (e){ console.error(e); error.textContent = e.message; if (!document.getElementById('errCarga')) alert(e.message); }
}

/* ---------- Muestreo (definitivo) ---------- */
function seleccionar(N, n, semillaHex){
  const semilla = semillaHex ? parseInt(semillaHex, 16) >>> 0 : crypto.getRandomValues(new Uint32Array(1))[0];
  const rnd = mulberry32(semilla);
  const pos = Array.from({length:N}, (_, i) => i + 1);
  for (let i = N - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [pos[i], pos[j]] = [pos[j], pos[i]]; }
  return {semilla: semilla.toString(16).padStart(8,'0'), seleccion: pos.slice(0, n).sort((a,b) => a - b)};
}
const universoUrgencias = (a = aud()) => a.registros.filter(r => norm(r.tipo) === 'URGENCIA');
const universoExternos = (a = aud()) => a.registros.filter(r => norm(r.tipo) === 'EXTERNO');
const huellaUniverso = async (universo) => huellaTexto(JSON.stringify(universo.map(r => r.ficha)));
const formatoHuella = h => h.length === 64 ? h.slice(0, 16).toUpperCase().match(/.{4}/g).join('-') : h;
// v5: los 4 primeros grupos dependen del universo (N° de ficha en orden), la semilla y la selección;
// el 5° grupo son los 4 primeros caracteres de la huella del archivo (permite saber si el archivo es idéntico)
async function codigoVerificacionV5(datos, m, tipo){
  const contenido = JSON.stringify({version:5, tipo, sucursal:datos.sucursal, periodo:datos.periodo, universo:m.huellaUniverso, N:m.N, n:m.n, semilla:m.semilla, fecha:m.fecha, seleccion:m.seleccion, p:tipo === 'urgencias' ? datos.parametros.p : null, e:tipo === 'urgencias' ? datos.parametros.e : null});
  const h = await huellaTexto(contenido);
  return h.length === 64 ? `${formatoHuella(h)}-${String(datos.hash).slice(0, 4).toUpperCase()}` : h;
}
async function codigoVerificacion(datos, m, tipo){
  const contenido = JSON.stringify({tipo, sucursal:datos.sucursal, periodo:datos.periodo, archivo:datos.hash, N:m.N, n:m.n, semilla:m.semilla, fecha:m.fecha, seleccion:m.seleccion, p:tipo === 'urgencias' ? datos.parametros.p : null, e:tipo === 'urgencias' ? datos.parametros.e : null});
  const h = await huellaTexto(contenido);
  return h.length === 64 ? h.slice(0, 16).toUpperCase().match(/.{4}/g).join('-') : h;
}
async function generarMuestraUrgencias(){
  const a = aud(); if (a.urgencias) return;
  a.turnos = {...turnosDe(a)};                                  // los turnos quedan registrados en la auditoría
  const U = universoUrgencias(a);
  const n = tamanoMuestral(U.length, a.parametros.p, a.parametros.e, a.parametros.z);
  const {semilla, seleccion} = seleccionar(U.length, n);
  const m = {N:U.length, n, semilla, fecha:hoyTexto(), seleccion,
    fichas: seleccion.map(pos => { const r = U[pos - 1]; return {pos, ficha:r.ficha, fecha:r.fecha, fechaIso:r.fechaIso, medico:r.medico, rut:r.rut, paciente:r.paciente, motivo:r.motivo, subtipo:r.subtipo, turno: turnoDeFecha(r.fechaIso, a.turnos, a.mesBase), items: ITEMS_CALIDAD.map(() => '')}; })};
  m.huellaUniverso = await huellaUniverso(U);
  m.codigo = await codigoVerificacionV5(a, m, 'urgencias');
  a.urgencias = m; guardar();
}
async function generarMuestraExternos(){
  const a = aud(); if (a.externos) return;
  if (!a.turnos) a.turnos = {...turnosDe(a)};
  const U = universoExternos(a);
  const n = Math.min(U.length, Math.max(1, Number(a.nExternos) || 10));
  const {semilla, seleccion} = seleccionar(U.length, n);
  const m = {N:U.length, n, semilla, fecha:hoyTexto(), seleccion,
    fichas: seleccion.map(pos => { const r = U[pos - 1]; return {pos, ficha:r.ficha, fecha:r.fecha, fechaIso:r.fechaIso, medico:r.medico, rut:r.rut, paciente:r.paciente, motivo:r.motivo, turno: turnoDeFecha(r.fechaIso, a.turnos, a.mesBase), orden:'', observaciones:''}; })};
  m.huellaUniverso = await huellaUniverso(U);
  m.codigo = await codigoVerificacionV5(a, m, 'externos');
  a.externos = m; guardar();
}

/* ---------- Resultados ---------- */
function resultadosUrgencias(a = aud()){
  const f = a.urgencias?.fichas || [];
  const completasFicha = f.filter(x => x.items.slice(0, INDICE_CI).every(Boolean));
  const cumpleFicha = completasFicha.filter(x => x.items.slice(0, INDICE_CI).every(v => v === 'CUMPLE')).length;
  const evaluadasCI = f.filter(x => x.items[INDICE_CI]).length;
  const cumpleCI = f.filter(x => x.items[INDICE_CI] === 'CUMPLE').length;
  const porItem = ITEMS_CALIDAD.map((_, i) => ({cumple:f.filter(x => x.items[i] === 'CUMPLE').length, noCumple:f.filter(x => x.items[i] === 'NO CUMPLE').length}));
  const completas = f.filter(x => x.items.every(Boolean)).length;
  return {total:f.length, evaluadasFicha:completasFicha.length, cumpleFicha, evaluadasCI, cumpleCI, porItem, completas, completa: completas === f.length};
}
const fichaCumple = x => { const v = x.items.slice(0, INDICE_CI); return v.every(Boolean) ? (v.every(y => y === 'CUMPLE') ? 'CUMPLE' : 'NO CUMPLE') : ''; };
// Externos: NO APLICA cuenta como cumplimiento
function resultadosExternos(x){
  const f = x?.fichas || [];
  const cumple = f.filter(e => e.orden === 'CUMPLE').length, noAplica = f.filter(e => e.orden === 'NO APLICA').length, noCumple = f.filter(e => e.orden === 'NO CUMPLE').length;
  return {total:f.length, cumple, noAplica, noCumple, logrado: cumple + noAplica, evaluados: cumple + noAplica + noCumple};
}

/* ---------- Cierre de auditoría ---------- */
const cerrada = a => !!a.cerrada;
function pendientes(a){
  const lista = [];
  (a.urgencias?.fichas || []).forEach(f => { const faltan = ITEMS_CALIDAD.filter((_, i) => !f.items[i]); if (faltan.length) lista.push(`ficha ${f.ficha} — ${faltan.join(', ')}`); });
  (a.externos?.fichas || []).forEach(f => { if (!f.orden) lista.push(`externo ficha ${f.ficha} — Orden médica`); });
  return lista;
}
function cerrarAuditoria(){
  const a = aud();
  if (!a.urgencias){ alert('Primero genera la muestra de urgencias.'); return; }
  const faltan = pendientes(a);
  if (faltan.length){
    mostrarPendientes = true; render();
    const items = (a.urgencias.fichas.reduce((s, f) => s + f.items.filter(v => !v).length, 0)) + (a.externos?.fichas || []).filter(f => !f.orden).length;
    alert(`No se puede cerrar: faltan ${items} ítem(s) por marcar.\n\n${faltan.slice(0, 12).join('\n')}${faltan.length > 12 ? `\n… y ${faltan.length - 12} ficha(s) más` : ''}\n\nLas celdas pendientes quedaron resaltadas en rojo.`);
    return;
  }
  if (!a.externos && !confirm('No se generó muestra de externos para esta auditoría. ¿Cerrar igual?')) return;
  if (!confirm('Al cerrar, los resultados quedan bloqueados. Para modificarlos habrá que reabrir la auditoría indicando un motivo. ¿Cerrar la auditoría?')) return;
  a.cerrada = hoyTexto(); a.historialCierre = a.historialCierre || []; a.historialCierre.push({accion:'Cerrada', fecha:a.cerrada, motivo:''});
  mostrarPendientes = false; guardar(); render();
}
function reabrirAuditoria(){
  const a = aud();
  const motivo = (prompt('Motivo de la reapertura (obligatorio):') || '').trim();
  if (!motivo){ alert('La reapertura requiere indicar un motivo.'); return; }
  a.historialCierre = a.historialCierre || []; a.historialCierre.push({accion:'Reabierta', fecha:hoyTexto(), motivo});
  a.cerrada = null; guardar(); render();
}
function panelCierre(a){
  const hist = (a.historialCierre || []).map(h => `${h.accion} el ${h.fecha}${h.motivo ? ' — motivo: ' + h.motivo : ''}`);
  return `<div class="row">${cerrada(a) ? `<span class="badge-cerrada">Auditoría cerrada el ${esc(a.cerrada)}</span><button class="btn sec" id="btnReabrir">Reabrir auditoría</button>` : `<button class="btn" id="btnCerrar" ${a.urgencias ? '' : 'disabled'}>Cerrar auditoría</button><span class="small muted">Solo se puede cerrar con todos los ítems marcados.</span>`}</div>
    ${hist.length ? `<p class="small muted" style="margin:.4rem 0 0">Historial: ${hist.map(esc).join(' · ')}</p>` : ''}`;
}
const pieCierre = a => { const hist = (a.historialCierre || []).map(h => `${h.accion} el ${h.fecha}${h.motivo ? ' (motivo: ' + h.motivo + ')' : ''}`); return `${cerrada(a) ? `Auditoría cerrada el ${a.cerrada}.` : 'Auditoría abierta (no cerrada).'}${hist.length ? ' Historial: ' + hist.join(' · ') + '.' : ''}`; };

      const antes = (tipo === 'urgencias' ? universoUrgencias(guardada) : universoExternos(guardada)).map(x => x.ficha), ahora = U.map(x => x.ficha);
      const setA = new Set(antes), setB = new Set(ahora);
      diferencias = {agregadas: ahora.filter(f => !setA.has(f)), eliminadas: antes.filter(f => !setB.has(f)), orden: antes.length === ahora.length && antes.some((f, i) => f !== ahora[i]) && !ahora.some(f => !setA.has(f))};
    }
    resultadoVerificacion = {nivel, motivo, sucursal:r.sucursal, periodo:r.periodo, hash:r.hash, N:U.length, n, seleccion, fichas:seleccion.map(pos => U[pos - 1]?.ficha), codigoCalculado:calculado, codigoIngresado:codigo, huellaUniverso:formatoHuella(m.huellaUniverso), diferencias};
    render();
  } catch (err){ console.error(err); error.textContent = err.message; }
}

/* ---------- Eventos ---------- */
function mantenerPosicion(fn){
  const y = window.scrollY, tablas = [...document.querySelectorAll('.tabla')].map(t => [t.scrollTop, t.scrollLeft]);
  fn(); render();
  window.scrollTo(0, y); document.querySelectorAll('.tabla').forEach((t, i) => { if (tablas[i]){ t.scrollTop = tablas[i][0]; t.scrollLeft = tablas[i][1]; } });
}
function enlazar(){
  const $ = id => document.getElementById(id);
  $('archivo')?.addEventListener('change', e => { const f = e.target.files[0]; if (f) procesarArchivo(f); });
  document.querySelectorAll('[data-abrir]').forEach(td => td.addEventListener('click', () => { actual = td.dataset.abrir; pestana = 'urgencias'; filtrosTodas = {}; render(); }));
  document.querySelectorAll('[data-borrar]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('¿Borrar esta auditoría y los datos de pacientes guardados en este navegador? Descarga antes los documentos si los necesitas.')) return;
    delete almacen.auditorias[b.dataset.borrar]; if (actual === b.dataset.borrar) actual = null; guardar(); render();
  }));
  document.querySelectorAll('[data-liberar]').forEach(b => b.addEventListener('click', () => liberarOriginal(b.dataset.liberar)));
  document.querySelectorAll('[data-cal]').forEach(s => s.addEventListener('change', () => {
    const [mes, dia] = s.dataset.cal.split('|'); almacen.calendario[mes] = almacen.calendario[mes] || {}; almacen.calendario[mes][dia] = s.value; guardar(); mantenerPosicion(() => {});
  }));
  $('btnAgregarMes')?.addEventListener('click', () => { const m = $('mesNuevo').value; if (!m) return; almacen.calendario[m] = almacen.calendario[m] || {}; guardar(); render(); });
  $('btnExportarAvance')?.addEventListener('click', () => { exportarAvance(); render(); });
  $('importarAvance')?.addEventListener('change', e => { const f = e.target.files[0]; if (f) importarAvance(f); });
  // Verificación
  const actualizarVer = () => { const t = $('verTipo')?.value; if (!t) return; $('verParametros').style.display = t === 'urgencias' ? '' : 'none'; $('verCantidad').style.display = t === 'externos' ? '' : 'none'; };
  $('verTipo')?.addEventListener('change', actualizarVer); actualizarVer();
  $('btnVerificar')?.addEventListener('click', verificar);
  const a = actual ? aud() : null; if (!a) return;
  // Todas las atenciones
  document.querySelectorAll('[data-filtro-col]').forEach(campo => campo.addEventListener(campo.tagName === 'SELECT' ? 'change' : 'input', () => {
    filtrosTodas[campo.dataset.filtroCol] = campo.value;
    const {html, total} = filasTodas(); $('cuerpoTodas').innerHTML = html; $('conteoTodas').innerHTML = `<strong>${total}</strong> de ${a.registros.length} registros`;
  }));
  $('btnLimpiarFiltros')?.addEventListener('click', () => { filtrosTodas = {}; render(); });
  // Configuración previa
  ['parP','parE'].forEach(id => $(id)?.addEventListener('change', () => {
    const p = Number($('parP').value), e = Number($('parE').value);
    if (!(p > 0 && p < 1) || !(e > 0 && e < 1)){ alert('p y e deben ser valores entre 0 y 1 (por ejemplo 0,95 y 0,1).'); render(); return; }
    a.parametros.p = p; a.parametros.e = e; guardar(); render();
  }));
  $('btnGenerarMuestra')?.addEventListener('click', async () => {
    const t = turnosDe(a); if (!t || !t.d1 || !t.d2){ $('errMuestra').textContent = 'Registra los turnos del día 1 y del día 2 de este mes antes de generar la muestra.'; return; }
    const n = tamanoMuestral(universoUrgencias(a).length, a.parametros.p, a.parametros.e);
    if (!confirm(`Se generará la muestra definitiva de ${n} fichas con p = ${a.parametros.p} y e = ${a.parametros.e}. Después no se podrá volver a aleatorizar. ¿Continuar?`)) return;
    await generarMuestraUrgencias(); render();
  });
  // Auditoría de urgencias: un clic marca NO CUMPLE, otro clic deja vacío
  document.querySelectorAll('.celda-ev[data-f]').forEach(c => c.addEventListener('click', () => mantenerPosicion(() => {
    const f = a.urgencias.fichas[+c.dataset.f], i = +c.dataset.i;
    f.items[i] = !f.items[i] ? 'CUMPLE' : f.items[i] === 'CUMPLE' ? 'NO CUMPLE' : ''; guardar(); actualFila = +c.dataset.f;
  })));
  document.querySelectorAll('select[data-turno]').forEach(s => s.addEventListener('change', () => mantenerPosicion(() => { a.urgencias.fichas[+s.dataset.turno].turno = s.value; guardar(); })));
  $('btnTodoCumple')?.addEventListener('click', () => mantenerPosicion(() => { a.urgencias.fichas.forEach(f => { f.items = f.items.map(v => v || 'CUMPLE'); }); guardar(); }));
  document.querySelectorAll('tr[data-fila]').forEach(tr => tr.addEventListener('click', () => { document.querySelectorAll('tr.activa').forEach(x => x.classList.remove('activa')); tr.classList.add('activa'); actualFila = +tr.dataset.fila; }));
  if (actualFila !== null) document.querySelector(`tr[data-fila="${actualFila}"]`)?.classList.add('activa');
  $('btnCertUrg')?.addEventListener('click', () => imprimir(certificado('urgencias'), `Certificado_Muestreo_Aleatorizacion_Urgencias_${nombreBase(a)}`, 'portrait'));
  // Externos
  $('nExternos')?.addEventListener('change', e => { a.nExternos = Math.max(1, Number(e.target.value) || 10); guardar(); });
  $('btnExternos')?.addEventListener('click', async () => {
    const t = turnosDe(a); if (!t || !t.d1 || !t.d2){ $('errExternos').textContent = 'Registra los turnos del día 1 y del día 2 de este mes antes de generar la muestra.'; return; }
    a.nExternos = Math.max(1, Number($('nExternos').value) || 10);
    if (!confirm(`Se generará la muestra definitiva de ${Math.min(a.nExternos, universoExternos(a).length)} externos. Después no se podrá volver a aleatorizar. ¿Continuar?`)) return;
    await generarMuestraExternos(); render();
  });
  document.querySelectorAll('select[data-ext]').forEach(s => s.addEventListener('change', () => mantenerPosicion(() => { a.externos.fichas[+s.dataset.ext].orden = s.value; guardar(); })));
  document.querySelectorAll('select[data-turno-ext]').forEach(s => s.addEventListener('change', () => mantenerPosicion(() => { a.externos.fichas[+s.dataset.turnoExt].turno = s.value; guardar(); })));
  document.querySelectorAll('input[data-obs]').forEach(inp => inp.addEventListener('input', () => { a.externos.fichas[+inp.dataset.obs].observaciones = inp.value; guardar(); }));
  $('btnExtTodoCumple')?.addEventListener('click', () => mantenerPosicion(() => { a.externos.fichas.forEach(f => { f.orden = f.orden || 'CUMPLE'; }); guardar(); }));
  $('btnCertExt')?.addEventListener('click', () => imprimir(certificado('externos'), `Certificado_Muestreo_Aleatorizacion_Externos_${nombreBase(a)}`, 'portrait'));
  // Resultados
  $('btnInforme')?.addEventListener('click', () => imprimir(informe(), `Informe_Contraloria_${nombreBase(a)}`, 'landscape'));
  $('btnExcelSucursal')?.addEventListener('click', () => excelDireccionMedica([actual], `Contraloria_Direccion_Medica_${nombreBase(a)}.xlsx`).catch(err => { console.error(err); alert('No se pudo generar el Excel: ' + err.message); }));
  $('btnRespaldo')?.addEventListener('click', () => excelRespaldo().catch(err => { console.error(err); alert('No se pudo generar el respaldo: ' + err.message); }));
  $('btnLiberar')?.addEventListener('click', () => liberarOriginal(actual));
  $('btnCerrar')?.addEventListener('click', cerrarAuditoria);
  $('btnReabrir')?.addEventListener('click', reabrirAuditoria);
  $('selPeriodo')?.addEventListener('change', e => { almacen.periodoConsolidado = e.target.value; guardar(); render(); });
  $('btnConsolidado')?.addEventListener('click', () => {
    const claves = [...document.querySelectorAll('[data-consolidar]:checked')].map(c => c.dataset.consolidar);
    const primera = almacen.auditorias[claves[0]];
    excelDireccionMedica(claves, `Consolidado_Contraloria_${mesTexto(primera?.mesBase)}.xlsx`).catch(err => { console.error(err); alert('No se pudo generar el Excel: ' + err.message); });
  });
}
let actualFila = null, mostrarPendientes = false;
async function completarHuellas(){
  let cambios = false;
  for (const a of Object.values(almacen.auditorias)){
    if (a.urgencias && !a.urgencias.huellaUniverso && a.registros){ a.urgencias.huellaUniverso = await huellaUniverso(universoUrgencias(a)); cambios = true; }
    if (a.externos && !a.externos.huellaUniverso && a.registros){ a.externos.huellaUniverso = await huellaUniverso(universoExternos(a)); cambios = true; }
  }
  if (cambios) guardar();
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { pestana = b.dataset.tab; actualFila = null; render(); }));
render();
completarHuellas().catch(e => console.error('No se pudieron calcular las huellas del universo', e));
</script>
